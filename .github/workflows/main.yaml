name: Main

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  id-token: write # REQUIRED for OIDC
  contents: read

env:
  PROJECT_NAME: 'wedding-kd'
  DOMAIN_NAME: 'kataesdomi.info'

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.vars.outputs.project_name }}
      domain_name: ${{ steps.vars.outputs.domain_name }}
    steps:
      - id: vars
        run: |
          echo "project_name=${{ env.PROJECT_NAME }}" >> "$GITHUB_OUTPUT"
          echo "domain_name=${{ env.DOMAIN_NAME }}" >> "$GITHUB_OUTPUT"
  
  build:
    name: Build, test, and generate static files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install
      - name: Check format
        run: bun format:check
      - name: Lint
        run: bun lint
      - name: Test
        run: bun run test
      - name: Generate static files
        run: bun generate
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: dist
